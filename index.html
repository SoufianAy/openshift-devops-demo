<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef6ff, #ffffff);
      color: #172033;
    }

    .card {
      width: min(600px, 90%);
      padding: 48px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      margin-bottom: 20px;
      border-radius: 999px;
      background: #e8f7ee;
      color: #137333;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    .version {
      margin: 20px 0;
      font-size: 28px;
      font-weight: bold;
      color: #0066cc;
    }

    .platform {
      margin-top: 30px;
      color: #667085;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">● Anwendung läuft</div>

    <h1>Hallo Azubis 👋</h1>

    <p>Willkommen zu unserer DevOps-Demo.</p>

    <div class="version" id="version">
      Version 1
    </div>

    <p class="platform">
      Bereitgestellt auf Red Hat OpenShift
    </p>
  </main>
</body>
</html>
